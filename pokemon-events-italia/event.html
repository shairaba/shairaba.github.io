<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pok&eacute;mon Event Locator but better</title>
  <!-- Static, non-dynamic OG tags: crawlers for WhatsApp/Telegram/etc. don't
       run JavaScript, so they can't see the actual event this page renders
       client-side from ?guid= - every shared event link gets this same
       generic branded preview rather than nothing. -->
  <meta name="description" content="Cerca i prossimi eventi Pok&eacute;mon ufficiali (VGC, GCC, GO) in tutta Italia: elenco, calendario e mappa, con tutti i dettagli.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shairaba.github.io/pokemon-events-italia/event.html">
  <meta property="og:title" content="Pok&eacute;mon Event Locator but better">
  <meta property="og:description" content="Cerca i prossimi eventi Pok&eacute;mon ufficiali (VGC, GCC, GO) in tutta Italia: elenco, calendario e mappa, con tutti i dettagli.">
  <meta property="og:image" content="https://shairaba.github.io/pokemon-events-italia/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="it_IT">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pok&eacute;mon Event Locator but better">
  <meta name="twitter:description" content="Cerca i prossimi eventi Pok&eacute;mon ufficiali (VGC, GCC, GO) in tutta Italia: elenco, calendario e mappa, con tutti i dettagli.">
  <meta name="twitter:image" content="https://shairaba.github.io/pokemon-events-italia/social-preview.png">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Applied before the stylesheet/first paint, from a saved cookie (or the
       OS preference on a first visit) - so a returning dark-mode user never
       sees a flash of the light theme while the page loads. The toggle
       button's own click handler (app.js) keeps this in sync afterward and
       re-saves the cookie. -->
  <script>
  (function () {
    var m = document.cookie.match(/(?:^|; )theme=(dark|light)/);
    var theme = m ? m[1] : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>
  <header class="topbar">
    <a class="brand-group" href="index.html">
      <img class="logo" src="logo.svg" alt="Pok&eacute;mon Event Locator but better">
      <div class="brand-text">
        <span class="brand">Pok&eacute;mon Event Locator but better</span>
        <span class="brand-tagline" data-i18n="brandTagline">Eventi VGC, GCC e GO in Italia</span>
      </div>
    </a>
    <div class="topbar-controls">
      <div class="lang-toggle">
        <button class="lang-btn" data-lang="it" type="button">IT</button>
        <button class="lang-btn" data-lang="en" type="button">EN</button>
      </div>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="theme-switch-icon theme-switch-sun" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </span>
        <span class="theme-switch-icon theme-switch-moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 1 0 10.5 10.5z"></path>
          </svg>
        </span>
        <span class="theme-switch-knob"></span>
      </button>
    </div>
  </header>
  <main class="container" id="main-content">
    <p class="loading" data-i18n="loading">Caricamento&hellip;</p>
  </main>

  <div id="cookie-banner" class="cookie-banner" style="display:none">
    <p data-i18n="cookieNotice">Questo sito salva solo le tue preferenze di tema e lingua sul tuo dispositivo (un cookie tecnico e il local storage del browser). Nessun dato viene inviato a terzi o usato per tracciamento.</p>
    <button id="cookie-accept" type="button" data-i18n="cookieAccept">Ho capito</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js?v=1"></script>
  <script>
    function metaItem(label, value) {
      if (!value) return "";
      return `<div><div class="detail-meta-label">${esc(label)}</div><div class="detail-meta-value">${esc(value)}</div></div>`;
    }

    function renderDetail(event) {
      const main = document.getElementById("main-content");
      const meta = typeMeta(event);
      document.title = `${displayName(event)} - ${t("brand")}`;

      const metaGrid = [
        metaItem(t("dateTime"), formatDate(event)),
        metaItem(t("regFrom"), event.registration_start ? formatDate({ ...event, start_date: event.registration_start }) : ""),
        metaItem(t("regTo"), event.registration_end ? formatDate({ ...event, start_date: event.registration_end }) : ""),
        metaItem(t("cost"), event.admission),
        metaItem(t("email"), event.contact_email),
        metaItem(t("phone"), event.contact_phone),
      ].filter(Boolean).join("");

      const actions = [];
      if (event.event_website) actions.push(`<a class="btn" href="${esc(event.event_website)}" target="_blank" rel="noopener">${esc(t("eventWebsite"))}</a>`);
      if (event.third_party_registration_website)
        actions.push(`<a class="btn ${event.event_website ? "btn-secondary" : ""}" href="${esc(event.third_party_registration_website)}" target="_blank" rel="noopener">${esc(t("signUp"))}</a>`);
      if (event.latitude && event.longitude)
        actions.push(`<a class="btn btn-secondary" href="${esc(googleMapsDirectionsUrl(event))}" target="_blank" rel="noopener">${esc(t("takeMeThere"))}</a>`);

      const attributesHtml = (event.attributes || [])
        .map((a) => `<span class="badge">${esc(a)}</span>`)
        .join("");

      main.innerHTML = `
        <a class="back-link" href="index.html">${esc(t("backToList"))}</a>

        ${event.is_active === false ? `<div class="inactive-note">${esc(t("inactiveNote"))}</div>` : ""}

        <div class="detail-badges">
          <span class="badge ${meta.className}">${typeIconHtml(meta)} ${esc(meta.label)}</span>
          ${gamePillsHtml(event.products)}
        </div>
        <h1 class="detail-title">${esc(displayName(event))}</h1>
        ${event.activity_group_display_id ? `<p class="detail-subtitle"><a class="venue-link" href="venue.html?vid=${esc(event.activity_group_display_id)}">${esc(placeName(event) && placeName(event) !== displayName(event) ? placeName(event) : t("viewVenueEvents"))} &rarr;</a></p>` : ""}

        ${metaGrid ? `<div class="detail-card"><div class="detail-meta-grid">${metaGrid}</div></div>` : ""}

        ${actions.length ? `<div class="detail-actions">${actions.join("")}</div>` : ""}

        ${event.full_address ? `
        <div class="detail-card">
          <div class="detail-section-title">${esc(t("address"))}</div>
          <div class="detail-address">${esc(event.full_address)}</div>
          <div id="detail-map"></div>
        </div>` : ""}

        ${event.details ? `
        <div class="detail-card">
          <div class="detail-section-title">${esc(t("description"))}</div>
          <div class="detail-description">${esc(event.details)}</div>
        </div>` : ""}

        ${attributesHtml ? `
        <div class="detail-card">
          <div class="detail-section-title">${esc(t("characteristics"))}</div>
          <div class="detail-attributes">${attributesHtml}</div>
        </div>` : ""}
      `;

      if (event.full_address && event.latitude && event.longitude) {
        const map = L.map("detail-map", { zoomControl: false, dragging: false, scrollWheelZoom: false, touchZoom: false })
          .setView([event.latitude, event.longitude], 15);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);
        L.marker([event.latitude, event.longitude]).addTo(map);
      }
    }

    (async function main() {
      let currentEvent = null;
      initThemeToggle();
      initCookieConsent();
      initLangToggle(() => currentEvent && renderDetail(currentEvent));

      const main = document.getElementById("main-content");
      const guid = qs("guid");
      if (!guid) {
        main.innerHTML = `<p class="empty-state">${esc(t("noEventSpecified"))}</p>`;
        return;
      }

      let events;
      try {
        events = await loadEvents();
      } catch (err) {
        main.innerHTML = `<p class="empty-state">${esc(t("loadError"))}</p>`;
        console.error(err);
        return;
      }

      currentEvent = events.find((e) => e.guid === guid);
      if (!currentEvent) {
        main.innerHTML = `<p class="empty-state">${esc(t("eventNotFound"))}</p>`;
        return;
      }

      renderDetail(currentEvent);
    })();
  </script>
</body>
</html>
