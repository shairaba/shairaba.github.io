<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pok&eacute;mon Event Locator but better</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Pok&eacute;mon Event Locator but better</a>
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="it" type="button">IT</button>
      <button class="lang-btn" data-lang="en" type="button">EN</button>
    </div>
  </header>
  <main class="container" id="main-content">
    <p class="loading" data-i18n="loading">Caricamento&hellip;</p>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
  <script>
    function metaItem(label, value) {
      if (!value) return "";
      return `<div><div class="detail-meta-label">${esc(label)}</div><div class="detail-meta-value">${esc(value)}</div></div>`;
    }

    function renderDetail(event) {
      const main = document.getElementById("main-content");
      const meta = typeMeta(event);
      document.title = `${displayName(event)} - ${t("brand")}`;

      const metaGrid = [
        metaItem(t("dateTime"), formatDate(event)),
        metaItem(t("regFrom"), event.registration_start ? formatDate({ ...event, start_date: event.registration_start }) : ""),
        metaItem(t("regTo"), event.registration_end ? formatDate({ ...event, start_date: event.registration_end }) : ""),
        metaItem(t("cost"), event.admission),
        metaItem(t("email"), event.contact_email),
        metaItem(t("phone"), event.contact_phone),
      ].filter(Boolean).join("");

      const actions = [];
      if (event.event_website) actions.push(`<a class="btn" href="${esc(event.event_website)}" target="_blank" rel="noopener">${esc(t("eventWebsite"))}</a>`);
      if (event.third_party_registration_website)
        actions.push(`<a class="btn ${event.event_website ? "btn-secondary" : ""}" href="${esc(event.third_party_registration_website)}" target="_blank" rel="noopener">${esc(t("signUp"))}</a>`);
      if (event.latitude && event.longitude)
        actions.push(`<a class="btn btn-secondary" href="${esc(googleMapsDirectionsUrl(event))}" target="_blank" rel="noopener">${esc(t("takeMeThere"))}</a>`);

      const attributesHtml = (event.attributes || [])
        .map((a) => `<span class="badge">${esc(a)}</span>`)
        .join("");

      main.innerHTML = `
        <a class="back-link" href="index.html">${esc(t("backToList"))}</a>

        ${event.is_active === false ? `<div class="inactive-note">${esc(t("inactiveNote"))}</div>` : ""}

        <div class="detail-badges">
          <span class="badge ${meta.className}">${typeIconHtml(meta)} ${esc(meta.label)}</span>
          ${gamePillsHtml(event.products)}
        </div>
        <h1 class="detail-title">${esc(displayName(event))}</h1>
        ${placeName(event) && placeName(event) !== displayName(event) ? `<p class="detail-subtitle">${esc(placeName(event))}</p>` : ""}

        ${metaGrid ? `<div class="detail-card"><div class="detail-meta-grid">${metaGrid}</div></div>` : ""}

        ${actions.length ? `<div class="detail-actions">${actions.join("")}</div>` : ""}

        ${event.full_address ? `
        <div class="detail-card">
          <div class="detail-section-title">${esc(t("address"))}</div>
          <div class="detail-address">${esc(event.full_address)}</div>
          <div id="detail-map"></div>
        </div>` : ""}

        ${event.details ? `
        <div class="detail-card">
          <div class="detail-section-title">${esc(t("description"))}</div>
          <div class="detail-description">${esc(event.details)}</div>
        </div>` : ""}

        ${attributesHtml ? `
        <div class="detail-card">
          <div class="detail-section-title">${esc(t("characteristics"))}</div>
          <div class="detail-attributes">${attributesHtml}</div>
        </div>` : ""}
      `;

      if (event.full_address && event.latitude && event.longitude) {
        const map = L.map("detail-map", { zoomControl: false, dragging: false, scrollWheelZoom: false, touchZoom: false })
          .setView([event.latitude, event.longitude], 15);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);
        L.marker([event.latitude, event.longitude]).addTo(map);
      }
    }

    (async function main() {
      let currentEvent = null;
      initLangToggle(() => currentEvent && renderDetail(currentEvent));

      const main = document.getElementById("main-content");
      const guid = qs("guid");
      if (!guid) {
        main.innerHTML = `<p class="empty-state">${esc(t("noEventSpecified"))}</p>`;
        return;
      }

      let events;
      try {
        events = await loadEvents();
      } catch (err) {
        main.innerHTML = `<p class="empty-state">${esc(t("loadError"))}</p>`;
        console.error(err);
        return;
      }

      currentEvent = events.find((e) => e.guid === guid);
      if (!currentEvent) {
        main.innerHTML = `<p class="empty-state">${esc(t("eventNotFound"))}</p>`;
        return;
      }

      renderDetail(currentEvent);
    })();
  </script>
</body>
</html>
