<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventi Pokémon Italia</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    integrity="sha256-YSWCMtmNZNwqex4CEw1nQhvFub2lmU7vcCKP+XVwwXA=" crossorigin="" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Eventi Pokémon Italia</span>
    <div class="view-toggle">
      <button id="view-list-btn" class="toggle-btn active" type="button">Elenco</button>
      <button id="view-calendar-btn" class="toggle-btn" type="button">Calendario</button>
      <button id="view-map-btn" class="toggle-btn" type="button">Mappa</button>
    </div>
  </header>
  <main class="container">
    <h1>Prossimi eventi Pok&eacute;mon in Italia</h1>
    <p class="lede meta" id="meta-note">Caricamento&hellip;</p>

    <form class="filter-bar" id="filter-form">
      <input type="text" id="q" placeholder="Cerca per nome, negozio, citt&agrave;...">
      <select id="type" class="pill-select">
        <option value="">Tutti i tipi</option>
        <option value="cup">Coppa di Lega</option>
        <option value="challenge">Sfida di Lega</option>
        <option value="tournament">Torneo</option>
        <option value="league">Lega</option>
      </select>
      <span class="filter-label">Da</span>
      <input type="date" id="date-from">
      <span class="filter-label">A</span>
      <input type="date" id="date-to">
      <label class="filter-checkbox">
        <input type="checkbox" id="include-inactive">
        <span>Includi eventi passati/scaduti</span>
      </label>
      <button type="submit">Filtra</button>
    </form>

    <div id="list-view">
      <div class="event-list" id="rows"><p class="loading">Caricamento&hellip;</p></div>
      <p class="showing-note" id="showing-note"></p>
    </div>

    <div id="calendar-view" style="display:none">
      <div class="cal-nav">
        <button id="cal-prev-month" class="cal-nav-btn" type="button" aria-label="Mese precedente">&lsaquo;</button>
        <div class="cal-month-label" id="cal-month-label"></div>
        <button id="cal-next-month" class="cal-nav-btn" type="button" aria-label="Mese successivo">&rsaquo;</button>
      </div>
      <div class="cal-daystrip" id="cal-daystrip"></div>
      <div class="cal-day-heading" id="cal-day-heading"></div>
      <div class="event-list" id="cal-events"></div>
    </div>

    <div id="map-view" style="display:none">
      <div id="map"></div>
    </div>

    <p class="footnote">Dati raccolti dal localizzatore eventi ufficiale Pok&eacute;mon. Non affiliato a The Pok&eacute;mon Company International.</p>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
    integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin=""></script>
  <script src="app.js"></script>
  <script>
    let allEvents = [];
    let calYear, calMonth, calSelectedKey;

    function currentFilterState() {
      return {
        q: document.getElementById("q").value.trim(),
        type: document.getElementById("type").value,
        dateFrom: document.getElementById("date-from").value,
        dateTo: document.getElementById("date-to").value,
        includeInactive: document.getElementById("include-inactive").checked,
      };
    }

    function applyFilters(events, filterState) {
      let rows = events;
      if (!filterState.includeInactive) rows = rows.filter((e) => e.is_active);
      if (filterState.q) {
        const q = filterState.q.toLowerCase();
        rows = rows.filter((e) =>
          [e.name, e.activity_group_name, e.venue_name, e.full_address]
            .filter(Boolean)
            .some((s) => s.toLowerCase().includes(q))
        );
      }
      if (filterState.type) rows = rows.filter((e) => eventTypeKey(e) === filterState.type);
      if (filterState.dateFrom) rows = rows.filter((e) => e.start_date && e.start_date.slice(0, 10) >= filterState.dateFrom);
      if (filterState.dateTo) rows = rows.filter((e) => e.start_date && e.start_date.slice(0, 10) <= filterState.dateTo);
      return rows.slice().sort((a, b) => (a.start_date || "").localeCompare(b.start_date || ""));
    }

    const MAX_ROWS = 300;

    function renderList(filtered) {
      const container = document.getElementById("rows");
      const shown = filtered.slice(0, MAX_ROWS);
      if (!shown.length) {
        container.innerHTML = '<p class="empty-state">Nessun evento trovato.</p>';
      } else {
        container.innerHTML = shown.map((e) => eventCardHtml(e, { showDate: true })).join("");
        wireEventCardClicks(container);
      }
      document.getElementById("showing-note").textContent =
        filtered.length > MAX_ROWS ? `Mostrati ${MAX_ROWS} di ${filtered.length} eventi corrispondenti.` : "";
    }

    let map = null;
    let markerLayer = null;

    function renderMap(filtered) {
      if (!map) {
        // Centered/zoomed for all of Italy, not any one region - a fixed
        // point+zoom tuned for Lombardy alone left the rest of the country
        // off-screen once coverage went nationwide.
        map = L.map("map").setView([42.5, 12.5], 6);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);
        // Clustering, not a plain layer group: thousands of individual pins
        // at nationwide scale render as unreadable overlapping clumps
        // (verified live) - markercluster groups nearby events into a
        // count bubble that splits apart as you zoom in.
        markerLayer = L.markerClusterGroup({ maxClusterRadius: 50 }).addTo(map);
      }
      markerLayer.clearLayers();
      filtered.forEach((e) => {
        const marker = L.marker([e.latitude, e.longitude]);
        marker.bindPopup(
          `<div class="popup-title">${esc(displayName(e))}</div>` +
            `<div class="popup-meta">${esc(typeMeta(e).label)} &middot; ${esc(formatDate(e))}</div>` +
            `<div class="popup-meta">${esc(placeName(e))}</div>` +
            `<div class="popup-meta"><a href="event.html?guid=${esc(e.guid)}">Dettagli &rarr;</a> &middot; <a href="${esc(googleMapsDirectionsUrl(e))}" target="_blank" rel="noopener">Portami l&igrave;</a></div>`
        );
        marker.addTo(markerLayer);
      });
    }

    /* Calendar: month nav + horizontal day-strip + the selected day's events. */
    function eventsByDayKey(filtered) {
      const map = {};
      filtered.forEach((e) => {
        const key = localDateKey(e);
        if (!key) return;
        (map[key] = map[key] || []).push(e);
      });
      return map;
    }

    function renderCalendar(filtered) {
      const byDay = eventsByDayKey(filtered);

      document.getElementById("cal-month-label").textContent = monthLabel(calYear, calMonth);

      const strip = document.getElementById("cal-daystrip");
      const todayKey = localDateKey({ start_date: new Date().toISOString() });
      const total = daysInMonth(calYear, calMonth);
      let chipsHtml = "";
      for (let day = 1; day <= total; day++) {
        const key = dateKeyFor(calYear, calMonth, day);
        const hasEvents = !!byDay[key];
        const classes = ["cal-day-chip"];
        if (key === calSelectedKey) classes.push("selected");
        if (key === todayKey) classes.push("today");
        chipsHtml += `
          <button type="button" class="${classes.join(" ")}" data-key="${key}">
            <span class="num">${day}</span>
            <span class="dow">${esc(dayOfWeekAbbrev(calYear, calMonth, day))}</span>
            ${hasEvents ? '<span class="dot"></span>' : ""}
          </button>`;
      }
      strip.innerHTML = chipsHtml;
      strip.querySelectorAll(".cal-day-chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          calSelectedKey = chip.dataset.key;
          renderCalendar(applyFilters(allEvents, currentFilterState()));
          const selected = strip.querySelector(".cal-day-chip.selected");
          if (selected) selected.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
        });
      });

      if (!calSelectedKey || !calSelectedKey.startsWith(`${calYear}-${String(calMonth + 1).padStart(2, "0")}`)) {
        // Landed on a different month - default to the first day with events, else the 1st.
        const firstWithEvents = Object.keys(byDay)
          .filter((k) => k.startsWith(`${calYear}-${String(calMonth + 1).padStart(2, "0")}`))
          .sort()[0];
        calSelectedKey = firstWithEvents || dateKeyFor(calYear, calMonth, 1);
        strip.querySelectorAll(".cal-day-chip").forEach((chip) => {
          chip.classList.toggle("selected", chip.dataset.key === calSelectedKey);
        });
      }

      const dayEvents = (byDay[calSelectedKey] || []).slice().sort((a, b) => (a.start_date || "").localeCompare(b.start_date || ""));
      document.getElementById("cal-day-heading").innerHTML =
        `${esc(formatDayHeading(calSelectedKey))} <span class="count">${dayEvents.length} eventi</span>`;

      const eventsContainer = document.getElementById("cal-events");
      if (!dayEvents.length) {
        eventsContainer.innerHTML = '<p class="empty-state">Nessun evento questo giorno.</p>';
      } else {
        eventsContainer.innerHTML = dayEvents.map((e) => eventCardHtml(e, { showDate: false })).join("");
        wireEventCardClicks(eventsContainer);
      }

      const selectedChip = strip.querySelector(".cal-day-chip.selected");
      if (selectedChip) selectedChip.scrollIntoView({ inline: "center", block: "nearest" });
    }

    function initCalendarDefaults(events) {
      const todayKey = localDateKey({ start_date: new Date().toISOString() });
      const upcoming = events
        .filter((e) => e.is_active)
        .map((e) => localDateKey(e))
        .filter(Boolean)
        .sort()
        .find((k) => k >= todayKey);
      const anchorKey = upcoming || todayKey;
      const [y, m] = anchorKey.split("-").map(Number);
      calYear = y;
      calMonth = m - 1;
      calSelectedKey = anchorKey;
    }

    function render() {
      const filtered = applyFilters(allEvents, currentFilterState());
      renderList(filtered);
      if (document.getElementById("map-view").style.display !== "none") renderMap(filtered);
      if (document.getElementById("calendar-view").style.display !== "none") renderCalendar(filtered);
    }

    const views = {
      list: { el: "list-view", btn: "view-list-btn" },
      calendar: { el: "calendar-view", btn: "view-calendar-btn" },
      map: { el: "map-view", btn: "view-map-btn" },
    };

    function showView(name) {
      Object.entries(views).forEach(([key, { el, btn }]) => {
        document.getElementById(el).style.display = key === name ? "" : "none";
        document.getElementById(btn).classList.toggle("active", key === name);
      });
      const filtered = applyFilters(allEvents, currentFilterState());
      if (name === "calendar") renderCalendar(filtered);
      if (name === "map") {
        renderMap(filtered);
        // Leaflet renders a blank/broken tile grid if initialized while its
        // container was display:none - invalidateSize() forces a re-measure
        // now that the container is actually visible.
        setTimeout(() => map && map.invalidateSize(), 0);
      }
    }

    document.getElementById("view-list-btn").addEventListener("click", () => showView("list"));
    document.getElementById("view-calendar-btn").addEventListener("click", () => showView("calendar"));
    document.getElementById("view-map-btn").addEventListener("click", () => showView("map"));

    document.getElementById("cal-prev-month").addEventListener("click", () => {
      calMonth -= 1;
      if (calMonth < 0) { calMonth = 11; calYear -= 1; }
      renderCalendar(applyFilters(allEvents, currentFilterState()));
    });
    document.getElementById("cal-next-month").addEventListener("click", () => {
      calMonth += 1;
      if (calMonth > 11) { calMonth = 0; calYear += 1; }
      renderCalendar(applyFilters(allEvents, currentFilterState()));
    });

    (async function main() {
      try {
        allEvents = await loadEvents();
      } catch (err) {
        document.getElementById("rows").innerHTML = '<p class="empty-state">Impossibile caricare i dati degli eventi.</p>';
        console.error(err);
        return;
      }

      initCalendarDefaults(allEvents);

      if (qs("q")) document.getElementById("q").value = qs("q");
      if (qs("type")) document.getElementById("type").value = qs("type");

      document.getElementById("filter-form").addEventListener("submit", (e) => {
        e.preventDefault();
        render();
      });
      document.getElementById("type").addEventListener("change", render);
      document.getElementById("include-inactive").addEventListener("change", render);

      const activeCount = allEvents.filter((e) => e.is_active).length;
      document.getElementById("meta-note").textContent = `${activeCount} eventi attivi in Italia.`;

      render();
    })();
  </script>
</body>
</html>
