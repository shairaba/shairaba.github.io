<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventi VGC Lombardia</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Eventi VGC Lombardia</span>
    <div class="view-toggle">
      <button id="view-list-btn" class="toggle-btn active" type="button">Elenco</button>
      <button id="view-map-btn" class="toggle-btn" type="button">Mappa</button>
    </div>
  </header>
  <main class="container">
    <h1>Prossimi eventi Pok&eacute;mon VGC in Lombardia</h1>
    <p class="lede meta" id="meta-note">Caricamento&hellip;</p>

    <form class="filter-bar" id="filter-form">
      <input type="text" id="q" placeholder="Cerca per nome, negozio, citt&agrave;...">
      <select id="type" class="pill-select">
        <option value="">Tutti i tipi</option>
        <option value="tournament">Torneo</option>
        <option value="play_session">Lega</option>
      </select>
      <span class="filter-label">Da</span>
      <input type="date" id="date-from">
      <span class="filter-label">A</span>
      <input type="date" id="date-to">
      <label class="filter-checkbox">
        <input type="checkbox" id="include-inactive">
        Includi eventi passati/scaduti
      </label>
      <button type="submit">Filtra</button>
    </form>

    <div id="list-view">
      <div class="table-scroll">
        <table class="list-table">
          <colgroup><col style="width:170px"><col><col style="width:130px"><col></colgroup>
          <thead><tr><th>Data</th><th>Evento</th><th>Tipo</th><th>Luogo</th></tr></thead>
          <tbody id="rows"><tr><td colspan="4" class="loading">Caricamento&hellip;</td></tr></tbody>
        </table>
      </div>
      <p class="showing-note" id="showing-note"></p>
    </div>

    <div id="map-view" style="display:none">
      <div id="map"></div>
    </div>

    <p class="footnote">Dati raccolti dal localizzatore eventi ufficiale Pok&eacute;mon. Non affiliato a The Pok&eacute;mon Company International.</p>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
