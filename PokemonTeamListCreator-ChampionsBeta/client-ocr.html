<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PokePaste Screenshot Reader (Browser-only)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #121218;
    color: #f2f3f7;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #9096a8; margin-top: 0; font-size: 14px; }
  .card {
    background: #1b1b24;
    border: 1px solid #2b2b38;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
  }
  label { display: block; font-size: 12px; color: #9096a8; margin-bottom: 6px; }
  select, input[type=file] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #2b2b38;
    background: #0b0b10;
    color: #f2f3f7;
    margin-bottom: 14px;
  }
  .uploads { display: flex; gap: 14px; flex-wrap: wrap; }
  .uploads > div { flex: 1 1 220px; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #7c5cff;
    color: white;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #6a4ce0; }
  #status { margin-top: 10px; font-size: 13px; color: #9096a8; min-height: 18px; }
  #status.error { color: #ff6b6b; }
  #status.ok { color: #22c55e; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 320px;
    background: #0b0b10;
    color: #7ef29c;
    border: 1px solid #2b2b38;
    border-radius: 10px;
    padding: 14px;
    font-family: Menlo, Consolas, monospace;
    font-size: 13px;
  }
  #copy-btn { margin-top: 10px; background: #2b2b38; }
  #copy-btn:hover:not(:disabled) { background: #37374a; }
  .review-item { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #2b2b38; }
  .review-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .review-item-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; }
  .review-choices { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .review-choice-btn {
    width: auto;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: normal;
    background: #0b0b10;
    border: 1px solid #2b2b38;
    color: #f2f3f7;
  }
  .review-choice-btn:hover:not(:disabled) { background: #24242f; }
  .review-choice-btn.selected { background: #7c5cff; border-color: #7c5cff; }
  .review-manual-input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #2b2b38;
    background: #0b0b10;
    color: #f2f3f7;
    font-size: 13px;
  }
</style>
</head>
<body>

<h1>PokePaste Screenshot Reader</h1>
<p class="sub">Runs entirely in your browser - no server, no upload. Pick the "Moves &amp; More" and "Stats" screenshots from a Pokemon Champions team screen.</p>

<div class="card">
  <label for="lang-select">Screenshot language</label>
  <select id="lang-select">
    <option value="en" selected>English</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="it">Italian</option>
    <option value="es">Spanish</option>
    <option value="ja">Japanese</option>
    <option value="ko">Korean</option>
    <option value="zh-Hans">Chinese (Simplified)</option>
    <option value="zh-Hant">Chinese (Traditional)</option>
  </select>

  <div class="uploads">
    <div>
      <label for="img-moves">Moves &amp; More screen</label>
      <input type="file" id="img-moves" accept="image/*">
    </div>
    <div>
      <label for="img-stats">Stats screen</label>
      <input type="file" id="img-stats" accept="image/*">
    </div>
  </div>

  <button id="btn-generate" disabled>Generate PokePaste</button>
  <div id="status">Pick both screenshots to begin.</div>
</div>

<div class="card" id="review-card" style="display:none">
  <label>Low-confidence reads - please confirm</label>
  <p class="sub" style="margin-top:0;">Pick the correct value for each field below, or type your own.</p>
  <div id="review-list"></div>
  <button id="review-confirm">Confirm &amp; Generate</button>
</div>

<div class="card">
  <label for="output">Output</label>
  <textarea id="output" placeholder="Your pokepaste will appear here..." readonly></textarea>
  <button id="copy-btn" disabled>Copy to clipboard</button>
</div>

<script type="importmap">
{
  "imports": {
    "ppu-paddle-ocr/web": "https://esm.sh/ppu-paddle-ocr/web"
  }
}
</script>
<script src="./coi-serviceworker.js"></script>
<script type="module" src="./client-ocr/main.mjs"></script>

</body>
</html>
