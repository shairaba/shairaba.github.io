<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VGC Locals Italia</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <!-- Applied before first paint from a saved cookie (or OS preference on a
       first visit), matching ../pokemon-events-italia/index.html's script -
       so a returning dark-mode visitor never sees a flash of the light theme. -->
  <script>
  (function () {
    var m = document.cookie.match(/(?:^|; )theme=(dark|light)/);
    var theme = m ? m[1] : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand-group" href="index.html">
      <img class="logo" src="logo.svg" alt="">
      <span class="brand">VGC Locals Italia</span>
    </a>
    <div class="topbar-controls">
      <nav>
        <a href="dashboard.html" data-i18n="navDashboard">Dashboard</a>
      </nav>
      <div class="lang-toggle">
        <button class="lang-btn" data-lang="it" type="button">IT</button>
        <button class="lang-btn" data-lang="en" type="button">EN</button>
      </div>
      <button id="theme-toggle" type="button" data-i18n-aria-label="themeToggleLabel" aria-label="Toggle dark mode">
        <span class="theme-switch-icon theme-switch-sun" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </span>
        <span class="theme-switch-icon theme-switch-moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 1 0 10.5 10.5z"></path>
          </svg>
        </span>
        <span class="theme-switch-knob"></span>
      </button>
    </div>
  </header>
  <main class="container">
    <h1 data-i18n="indexH1">Italian VGC Locals</h1>

    <form class="filter-bar" id="filter-form">
      <input type="text" id="f-search" data-i18n-placeholder="searchPlaceholder" placeholder="Search by tournament or Pok&eacute;mon name…" autocomplete="off">
      <div class="type-toggle" id="type-toggle">
        <button type="button" class="type-toggle-btn active" data-type="" data-i18n="filterAll">All</button>
        <button type="button" class="type-toggle-btn" data-type="VG Cup">Cup</button>
        <button type="button" class="type-toggle-btn" data-type="VG Challenge">Challenge</button>
      </div>
    </form>

    <div class="species-filter" id="species-filter"></div>

    <p class="showing-note" id="showing-note"></p>

    <div class="tournament-list" id="tournament-list"><p class="loading" data-i18n="loading">Loading&hellip;</p></div>

    <p class="footnote" data-i18n="footnoteDisclaimer">Not affiliated with The Pok&eacute;mon Company International.</p>
  </main>

  <script src="app.js"></script>
  <script src="sprite-map.js"></script>
  <script>
    let allTournaments = [];
    let activeType = "";
    let activeSpecies = ""; // species_id, or "" for no filter

    // Top 6 by overall top-cut usage (dashboard.json's own pooled stat,
    // same one the Dashboard page shows) - not just winners. Clicking a
    // button still filters to tournaments whose *winner* used it (see
    // winnerTeamHasSpecies below), so a given button can occasionally match
    // nothing - an accepted tradeoff for using the more meaningful stat.
    function renderSpeciesFilter(topPokemon) {
      const top = (topPokemon || []).slice(0, 6);
      const container = document.getElementById("species-filter");
      if (!top.length) {
        container.innerHTML = "";
        return;
      }
      container.innerHTML = top
        .map(
          (s) => `
        <button type="button" class="species-filter-btn${s.species_id === activeSpecies ? " active" : ""}" data-species="${esc(s.species_id)}">
          ${spriteChipHtml(s.species_id, s.species_name)}
          <span>${esc(s.species_name)}</span>
        </button>`
        )
        .join("");
    }

    function tournamentCardHtml(tourney) {
      const winnerHtml = tourney.winner
        ? `
          <div class="tournament-card-winner">
            <span class="tournament-card-winner-label">${esc(t("winnerLabel", tourney.winner.player_name || t("anonymous")))}</span>
            ${spriteRowHtml(tourney.winner.team)}
          </div>`
        : `<p class="muted">${esc(t("noTeamsYet"))}</p>`;

      return `
        <a class="tournament-card" href="t/${encodeURIComponent(tourney.id)}.html">
          <div class="tournament-card-head">
            <span class="tournament-card-title">${esc(tourney.name)}</span>
            ${typeBadgeHtml(tourney.tournament_type)}
          </div>
          <p class="tournament-card-meta">${esc(t("cardMeta", tourney.date, tourney.number_of_players, tourney.top_cut_size))}</p>
          ${locationLineHtml(tourney.location, { linked: false })}
          ${winnerHtml}
        </a>`;
    }

    function winnerTeamHasSpecies(tourney, speciesId) {
      return !!(tourney.winner && tourney.winner.team && tourney.winner.team.some((mon) => mon.species_id === speciesId));
    }

    function matchesSearch(tourney, q) {
      if (tourney.name.toLowerCase().includes(q)) return true;
      return !!(tourney.winner && tourney.winner.team && tourney.winner.team.some((mon) => mon.species_name.toLowerCase().includes(q)));
    }

    function render() {
      const q = document.getElementById("f-search").value.trim().toLowerCase();
      const filtered = allTournaments.filter((tourney) => {
        if (activeType && tourney.tournament_type !== activeType) return false;
        if (activeSpecies && !winnerTeamHasSpecies(tourney, activeSpecies)) return false;
        if (q && !matchesSearch(tourney, q)) return false;
        return true;
      });

      const container = document.getElementById("tournament-list");
      if (!filtered.length) {
        container.innerHTML = allTournaments.length
          ? `<p class="empty-state">${esc(t("noMatchFilters"))}</p>`
          : `<p class="empty-state">${esc(t("noTournamentsYet"))}</p>`;
      } else {
        container.innerHTML = filtered.map(tournamentCardHtml).join("");
      }
      document.getElementById("showing-note").textContent = allTournaments.length
        ? t("showingNote", filtered.length, allTournaments.length)
        : "";
    }

    document.getElementById("f-search").addEventListener("input", render);
    document.getElementById("type-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest(".type-toggle-btn");
      if (!btn) return;
      activeType = btn.dataset.type;
      document.querySelectorAll(".type-toggle-btn").forEach((b) => b.classList.toggle("active", b === btn));
      render();
    });
    document.getElementById("species-filter").addEventListener("click", (e) => {
      const btn = e.target.closest(".species-filter-btn");
      if (!btn) return;
      // Clicking the already-active filter clears it; otherwise select it.
      activeSpecies = btn.dataset.species === activeSpecies ? "" : btn.dataset.species;
      document
        .querySelectorAll(".species-filter-btn")
        .forEach((b) => b.classList.toggle("active", b.dataset.species === activeSpecies));
      render();
    });

    let dashboardData = null;

    (async function () {
      const [tournaments, dashboard] = await Promise.all([
        fetchJSON("data/tournaments.json"),
        fetchJSON("data/dashboard.json"),
      ]);
      allTournaments = tournaments;
      dashboardData = dashboard;
      allTournaments.sort((a, b) => (a.date < b.date ? 1 : -1));
      renderSpeciesFilter(dashboard.top_pokemon);
      render();
      initLangToggle(() => {
        renderSpeciesFilter(dashboardData.top_pokemon);
        render();
      });
    })();
  </script>
</body>
</html>
